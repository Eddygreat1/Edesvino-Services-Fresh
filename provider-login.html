<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Provider Login | Edesvino Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 450px;
      margin: 55px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #087443;
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: #087443;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .forgot-button {
      display: block;
      width: auto;
      margin: 12px 0 0 auto;
      padding: 5px 0;
      background: transparent;
      color: #087443;
      font-size: 14px;
      text-align: right;
    }

    .forgot-button:disabled {
      background: transparent;
      color: #888;
    }

    #message {
      display: none;
      padding: 14px;
      margin-top: 18px;
      border-radius: 7px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #e5f7e9;
      color: #17632b;
    }

    .error {
      display: block !important;
      background: #ffe8e8;
      color: #a00000;
    }

    .links {
      text-align: center;
      margin-top: 22px;
      line-height: 2;
    }

    a {
      color: #087443;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Provider Login</h1>

  <p class="subtitle">
    Sign in to your Edesvino Services provider account.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      required
      autocomplete="email"
      placeholder="Enter your registered email"
    >

    <label for="password">Password</label>

    <input
      type="password"
      id="password"
      required
      autocomplete="current-password"
      placeholder="Enter your password"
    >

    <button
      type="button"
      id="forgotButton"
      class="forgot-button"
    >
      Forgot Password?
    </button>

    <button type="submit" id="loginButton">
      Sign In
    </button>

  </form>

  <div id="message"></div>

  <div class="links">
    Don't have a provider account?
    <a href="provider-register.html">Register Here</a>
    <br>
    <a href="index.html">Back to Homepage</a>
  </div>

</div>

<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://dhsfvctmvgmzrnpgxznd.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_4ZDqpnq4q6gubdteRQCc5A_JX-OUwlm';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById('loginForm');
  const message = document.getElementById('message');
  const loginButton = document.getElementById('loginButton');
  const forgotButton = document.getElementById('forgotButton');
  const emailInput = document.getElementById('email');

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
    message.style.display = 'block';
  }

  // PASSWORD RECOVERY

  forgotButton.addEventListener('click', async function() {

    message.style.display = 'none';

    const email = emailInput.value.trim().toLowerCase();

    if (!email) {
      showMessage(
        'Please enter your registered email address first.',
        'error'
      );
      emailInput.focus();
      return;
    }

    if (!emailInput.checkValidity()) {
      showMessage(
        'Please enter a valid email address.',
        'error'
      );
      emailInput.focus();
      return;
    }

    forgotButton.disabled = true;
    forgotButton.textContent = 'Sending Recovery Email...';

    try {

      const { error } =
        await supabase.auth.resetPasswordForEmail(email, {

          redirectTo:
            'https://edesvino-services-fresh.pages.dev/reset-password.html'

        });

      if (error) {
        throw error;
      }

      showMessage(
        'Password recovery email requested successfully. ' +
        'Please check your inbox and Spam folder. ' +
        'Open the recovery link to create a new password.',
        'success'
      );

    } catch (error) {

      showMessage(
        error.message || 'Unable to send recovery email. Please try again.',
        'error'
      );

    } finally {

      forgotButton.disabled = false;
      forgotButton.textContent = 'Forgot Password?';

    }

  });


  // PROVIDER LOGIN

  form.addEventListener('submit', async function(event) {

    event.preventDefault();

    message.style.display = 'none';

    const email =
      emailInput.value.trim().toLowerCase();

    const password =
      document.getElementById('password').value;

    loginButton.disabled = true;
    loginButton.textContent = 'Signing In...';

    try {

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      const user = data.user;

      if (!user) {
        throw new Error('Unable to retrieve your account.');
      }

      const details = user.user_metadata || {};

      if (details.account_type !== 'service_provider') {

        await supabase.auth.signOut();

        throw new Error(
          'This account is not registered as an Edesvino Services provider account.'
        );

      }

      if (
        !details.full_name ||
        !details.phone ||
        !details.location ||
        !details.state ||
        !details.primary_category ||
        !details.service_description
      ) {

        throw new Error(
          'Your provider registration details are incomplete. Please contact Edesvino support.'
        );

      }

      const { data: existingProvider, error: lookupError } =
        await supabase
          .from('service_providers')
          .select('id, approval_status')
          .eq('id', user.id)
          .maybeSingle();

      if (lookupError) {
        throw lookupError;
      }

      if (!existingProvider) {

        const combinedLocation =
          details.location + ', ' + details.state;

        const combinedDescription =
          details.service_description +
          '\n\nExperience: ' + details.experience;

        const { error: insertError } =
          await supabase
            .from('service_providers')
            .insert({

              id: user.id,

              business_name:
                details.business_name || details.full_name,

              full_name: details.full_name,

              email: user.email,

              phone: details.phone,

              location: combinedLocation,

              description: combinedDescription,

              primary_category: details.primary_category,

              approval_status: 'pending'

            });

        if (insertError) {
          throw insertError;
        }

      }

      showMessage(
        'Login successful! Your provider account has been connected. Redirecting to your dashboard...',
        'success'
      );

      loginButton.textContent = 'Login Successful';

      setTimeout(function() {
        window.location.href = 'provider-dashboard.html';
      }, 1800);

    } catch (error) {

      showMessage(
        error.message || 'Login failed. Please try again.',
        'error'
      );

      loginButton.disabled = false;
      loginButton.textContent = 'Sign In';

    }

  });

</script>

</body>
</html>
