<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | Edesvino Services</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f7f6;
      color: #222;
    }

    .container {
      max-width: 450px;
      margin: 55px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #087443;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #666;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .password-wrapper {
      display: flex;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      min-width: 0;
    }

    .password-wrapper input {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 24px;
      background: #087443;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .toggle-button {
      width: auto;
      min-width: 75px;
      margin: 0;
      padding: 10px;
      background: #eaf6ef;
      color: #087443;
      border: 1px solid #087443;
      font-size: 14px;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    .toggle-button:disabled {
      background: #eaf6ef;
      color: #888;
    }

    #message {
      display: none;
      padding: 14px;
      margin-top: 18px;
      border-radius: 7px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .success {
      display: block !important;
      background: #e5f7e9;
      color: #17632b;
    }

    .error {
      display: block !important;
      background: #ffe8e8;
      color: #a00000;
    }

    .links {
      text-align: center;
      margin-top: 22px;
    }

    a {
      color: #087443;
      font-weight: bold;
    }

    .small-text {
      color: #666;
      font-size: 13px;
      margin-top: 7px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Reset Your Password</h1>

  <p class="subtitle">
    Create a new password for your Edesvino Services account.
  </p>

  <form id="resetForm">

    <label for="password">New Password</label>

    <div class="password-wrapper">
      <input
        type="password"
        id="password"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your new password"
      >

      <button
        type="button"
        class="toggle-button"
        id="togglePassword"
      >
        Show
      </button>
    </div>

    <div class="small-text">
      Your password must contain at least 8 characters.
    </div>

    <label for="confirmPassword">Confirm New Password</label>

    <div class="password-wrapper">
      <input
        type="password"
        id="confirmPassword"
        required
        minlength="8"
        autocomplete="new-password"
        placeholder="Enter your new password again"
      >

      <button
        type="button"
        class="toggle-button"
        id="toggleConfirmPassword"
      >
        Show
      </button>
    </div>

    <button type="submit" id="resetButton">
      Update Password
    </button>

  </form>

  <div id="message"></div>

  <div class="links">
    <a href="provider-login.html">Back to Provider Login</a>
  </div>

</div>

<script type="module">

  import { createClient } from
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const SUPABASE_URL =
    'https://dhsfvctmvgmzrnpgxznd.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_4ZDqpnq4q6gubdteRQCc5A_JX-OUwlm';

  const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById('resetForm');
  const message = document.getElementById('message');
  const resetButton = document.getElementById('resetButton');

  const passwordInput = document.getElementById('password');
  const confirmPasswordInput = document.getElementById('confirmPassword');

  const togglePassword = document.getElementById('togglePassword');
  const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');

  let recoverySessionReady = false;

  function showMessage(text, type) {
    message.textContent = text;
    message.className = type;
    message.style.display = 'block';
  }

  // SHOW AND HIDE NEW PASSWORD

  togglePassword.addEventListener('click', function() {

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      togglePassword.textContent = 'Hide';
    } else {
      passwordInput.type = 'password';
      togglePassword.textContent = 'Show';
    }

  });

  // SHOW AND HIDE CONFIRM PASSWORD

  toggleConfirmPassword.addEventListener('click', function() {

    if (confirmPasswordInput.type === 'password') {
      confirmPasswordInput.type = 'text';
      toggleConfirmPassword.textContent = 'Hide';
    } else {
      confirmPasswordInput.type = 'password';
      toggleConfirmPassword.textContent = 'Show';
    }

  });

  // CHECK RECOVERY SESSION

  async function checkRecoverySession() {

    try {

      const { data, error } =
        await supabase.auth.getSession();

      if (error) {
        throw error;
      }

      if (data.session) {

        recoverySessionReady = true;

      } else {

        recoverySessionReady = false;

        showMessage(
          'Your password recovery link is invalid or has expired. Please request a new recovery email from Provider Login.',
          'error'
        );

        resetButton.disabled = true;

      }

    } catch (error) {

      showMessage(
        error.message || 'Unable to verify your recovery link.',
        'error'
      );

      resetButton.disabled = true;

    }

  }

  await checkRecoverySession();

  supabase.auth.onAuthStateChange((event, session) => {

    if (
      event === 'PASSWORD_RECOVERY' ||
      (event === 'SIGNED_IN' && session)
    ) {

      recoverySessionReady = true;
      resetButton.disabled = false;

    }

  });

  // UPDATE PASSWORD

  form.addEventListener('submit', async function(event) {

    event.preventDefault();

    message.style.display = 'none';

    if (!recoverySessionReady) {

      showMessage(
        'Your recovery link is not active. Please request a new one.',
        'error'
      );

      return;

    }

    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;

    if (password.length < 8) {

      showMessage(
        'Your password must contain at least 8 characters.',
        'error'
      );

      return;

    }

    if (password !== confirmPassword) {

      showMessage(
        'Your passwords do not match. Please try again.',
        'error'
      );

      return;

    }

    resetButton.disabled = true;
    resetButton.textContent = 'Updating Password...';

    try {

      const { error } =
        await supabase.auth.updateUser({
          password: password
        });

      if (error) {
        throw error;
      }

      await supabase.auth.signOut();

      form.reset();

      recoverySessionReady = false;

      showMessage(
        'Your password has been changed successfully! You can now sign in using your new password. Redirecting to Provider Login...',
        'success'
      );

      setTimeout(function() {
        window.location.href = 'provider-login.html';
      }, 2500);

    } catch (error) {

      showMessage(
        error.message || 'Password update failed. Please try again.',
        'error'
      );

      resetButton.disabled = false;
      resetButton.textContent = 'Update Password';

    }

  });

</script>

</body>
</html>
