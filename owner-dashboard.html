<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Access Diagnostic | Edesvino Services</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {
    font-family: Arial, sans-serif;
    background: #faf7ef;
    padding: 25px;
    color: #24352e;
}
.box {
    max-width: 450px;
    margin: 35px auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
}
input, button {
    width: 100%;
    padding: 13px;
    margin: 9px 0;
    box-sizing: border-box;
}
button {
    background: #064e3b;
    color: white;
    border: 0;
    border-radius: 7px;
}
#result {
    overflow-wrap: anywhere;
    line-height: 1.7;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="box">
    <h2>EDESVINO SERVICES</h2>
    <h3>Owner Access Diagnostic</h3>

    <form id="loginForm">
        <input type="email" id="email"
        placeholder="Owner email" required>

        <input type="password" id="password"
        placeholder="Password" required>

        <button type="submit">Check Owner Access</button>
    </form>

    <div id="result">Please sign in to begin the check.</div>
</div>

<script>
const client = window.supabase.createClient(
    'https://dhsfvctmvgmzrnpgxznd.supabase.co',
    'sb_publishable_4ZDqpnq4q6gubdteRQCc5A_JX-OUwlm'
);

document.getElementById('loginForm').addEventListener(
    'submit', async function(event) {

    event.preventDefault();

    const result = document.getElementById('result');
    result.innerHTML = 'Checking account...';

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await client.auth.signInWithPassword({
        email,
        password
    });

    if (error) {
        result.innerHTML = 'LOGIN ERROR: ' + error.message;
        return;
    }

    const user = data.user;

    result.innerHTML =
        '<h3>Login successful</h3>' +
        '<b>Signed-in email:</b><br>' +
        user.email + '<br><br>' +
        '<b>Signed-in user ID:</b><br>' +
        user.id + '<br><br>' +
        'Checking owner record...';

    const { data: admin, error: adminError } = await client
        .from('platform_admins')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

    if (adminError) {
        result.innerHTML +=
            '<br><br><b>DATABASE ERROR:</b><br>' +
            adminError.message;
        return;
    }

    if (admin) {
        result.innerHTML +=
            '<br><br><b style="color:green">OWNER VERIFIED SUCCESSFULLY</b>';
    } else {
        result.innerHTML +=
            '<br><br><b style="color:red">OWNER RECORD NOT FOUND FOR THIS USER ID</b>';
    }
});
</script>

</body>
</html>
