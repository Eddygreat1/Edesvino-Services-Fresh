<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#064e38">

<title>Forgot Password | Edesvino Services</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #faf7ed;
    color: #26352e;
    min-height: 100vh;
}

header {
    background: #064e38;
    padding: 20px;
    color: white;
    font-weight: bold;
}

header span {
    color: #d6a62e;
}

.container {
    max-width: 440px;
    margin: 70px auto;
    padding: 30px 25px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

h1 {
    color: #064e38;
    text-align: center;
    font-size: 25px;
    margin-bottom: 15px;
}

.description {
    color: #666;
    text-align: center;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
}

label {
    display: block;
    color: #064e38;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 9px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 20px;
}

input:focus {
    outline: none;
    border-color: #087653;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #d6a62e;
    color: #173426;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    display: none;
    margin-top: 20px;
    padding: 13px;
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.back {
    text-align: center;
    margin-top: 25px;
}

.back a {
    color: #087653;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}

footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    padding: 20px;
}

@media(max-width: 500px) {
    .container {
        margin: 35px 14px;
    }
}
</style>
</head>

<body>

<header>
EDESVINO <span>SERVICES</span>
</header>

<main class="container">

<h1>Forgot Password?</h1>

<p class="description">
Enter the email address registered to your Edesvino Services account.
We'll send you a secure password recovery link.
</p>

<form id="forgotForm">

<label for="email">Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your registered email"
autocomplete="email"
required
>

<button type="submit" id="sendButton">
Send Recovery Link
</button>

</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="back">
<a href="customer-login.html">Back to Customer Login</a>
</div>

</main>

<footer>
© <span id="year"></span> Edesvino Services. All Rights Reserved.
</footer>

<script>
document.getElementById("year").textContent =
new Date().getFullYear();

const SUPABASE_URL =
"https://dhsfvctmvgmzrnpgxznd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_4ZDqpnq4q6gubdteRQCc5A_JX-OUwlm";

const supabaseClient = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const form = document.getElementById("forgotForm");
const message = document.getElementById("message");
const button = document.getElementById("sendButton");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
        showMessage("Please enter your email address.", false);
        return;
    }

    button.disabled = true;
    button.textContent = "Sending...";

    try {

        const { error } =
        await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo:
            window.location.origin + "/reset-password.html"
        });

        if (error) {
            throw error;
        }

        showMessage(
            "If an account exists with this email address, a password recovery email will be sent. Please check your inbox and spam folder.",
            true
        );

        form.reset();

    } catch (error) {

        showMessage(
            "Unable to send the recovery email. Please try again later.",
            false
        );

        console.error("Password recovery error:", error);

    } finally {

        button.disabled = false;
        button.textContent = "Send Recovery Link";

    }

});

function showMessage(text, success) {

    message.style.display = "block";

    message.style.background =
        success ? "#e8f5ec" : "#fff0ed";

    message.style.color =
        success ? "#087443" : "#b42318";

    message.textContent = text;
}
</script>

</body>
</html>
